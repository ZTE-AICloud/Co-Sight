          items:
            type: string
            format: binary
        metadata:
          type: string
          description: JSON 字符串：directoryId / kType / splitType 必填，splitOperator 缺键走
            NPE（500），coverFlag 可选
    ChunkCreateRequest:
      type: object
      required:
      - documentId
      - content
      properties:
        documentId:
          type: string
          description: 所属文档 ID
        content:
          type: string
          description: 切片正文，用于生成向量
        supplement:
          type: string
          description: 补充文本，缺省回落 content
    GraphExtractionForm:
      type: object
      required:
      - file
      - data
      properties:
        file:
          type: array
          items:
            type: string
            format: binary
        data:
          type: string
          description: JSON 字符串：name/category/props/operatorId/schemaId 必填
    GraphUpdateForm:
      type: object
      required:
      - data
      - deleteFiles
      - localFiles
      properties:
        data:
          type: string
          description: JSON 字符串，结构同抽图建库
        deleteFiles:
          type: string
          description: JSON 数组字符串
        localFiles:
          type: string
          description: JSON 数组字符串
        files:
          type: array
          items:
            type: string
            format: binary
    RetrievalRequest:
      type: object
      required:
      - question
      - bases
      properties:
        question:
          type: string
          description: 检索问题，不能为空白
        type:
          type: integer
          enum:
          - 0
          - 1
          description: 0 向量（默认）/ 1 关键词
        model:
          type: string
          description: embedding 注册名
        bases:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - baseList
            - priority
            properties:
              baseList:
                type: array
                minItems: 1
                items:
                  type: string
                description: 文档库 base 名：doc_<kb_id>
              priority:
                type: integer
                minimum: 0
                maximum: 10
              top_k:
                type: integer
                minimum: 1
                maximum: 80
                default: 8
              score_threshold:
                type: number
                minimum: 0
                maximum: 1
                default: 0
                description: 仅向量路生效
    GraphQueryRequest:
      type: object
      required:
      - query_type
      properties:
        query_type:
          type: string
          enum:
          - entity
          - edge
          - path
          - sub_graph
        filters:
          type: array
          items:
            type: object
            additionalProperties: true
          description: 过滤条件；类型类字段必须是数组
        depth:
          type: integer
          minimum: 1
          maximum: 100
        direction:
          type: string
          enum:
          - both
          - in
          - out
          default: both
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
        offset:
          type: integer
          minimum: 0
          default: 0
        cursor:
          type: string
          description: 给出时优先于 offset
        keyword:
          type: string
          description: 实体名称/ID/描述模糊匹配
    GraphEntityCreateRequest:
      type: object
      required:
      - entityId
      - entityType
      - properties
      properties:
        entityId:
          type: string
          description: 格式 {实体类型}_{序号}
        entityType:
          type: string
          description: 必须是模板已声明的实体类型
        properties:
          type: object
          additionalProperties: true
        edgeInfo:
          type: object
          description: 可选：同时建一条边
          properties:
            edgeId:
              type: string
            edgeType:
              type: string
            currentEntityId:
              type: string
            direction:
              type: string
              enum:
              - in
              - out
            properties:
              type: object
              additionalProperties: true
    GraphEntityUpdateRequest:
      type: object
      required:
      - entityType
      - properties
      properties:
        entityType:
          type: string
        properties:
          type: object
          additionalProperties: true
    GraphEdgeCreateRequest:
      type: object
      required:
      - edgeId
      - edgeType
      - sourceId
      - targetId
      - properties
      properties:
        edgeId:
          type: string
          description: 格式 {边类型}_{序号}
        edgeType:
          type: string
        sourceId:
          type: string
        targetId:
          type: string
        properties:
          type: object
          additionalProperties: true
    GraphEdgeUpdateRequest:
      type: object
      required:
      - edgeType
      - properties
      properties:
        edgeType:
          type: string
        properties:
          type: object
          additionalProperties: true
    GraphSchemaRequest:
      type: object
      description: 创建时 schema_id 必填；PATCH 时路径参数覆盖同名字段
      required:
      - schema_name
      - schema_desc
      - entities
      - edges
      properties:
        schema_id:
          type: string
        schema_name:
          type: string
        schema_desc:
          type: string
        entities:
          type: array
          items:
            type: object
            additionalProperties: true
          description: 实体类型；不能为空数组
        edges:
          type: array
          items:
            type: object
            additionalProperties: true
          description: 必须出现（可为 []）；缺键走 NPE（500）
    OperatorVisibilityRequest:
      type: object
      required:
      - public
      properties:
        public:
          type: boolean
    ModelCreateRequest:
      type: object
      required:
      - modelKind
      - modelName
      - baseUrl
      properties:
        modelKind:
          type: string
          enum:
          - llm
          - embedding
          - rerank
        modelName:
          type: string
          description: 注册名，同 kind 下唯一
        displayName:
          type: string
        apiModel:
          type: string
        baseUrl:
          type: string
          format: uri
        apiKey:
          type: string
          description: 加密存储，读取接口不回明文
        chatPath:
          type: string
        embeddingsPath:
          type: string
        modelsPath:
          type: string
        rerankPath:
          type: string
        dimension:
          type: integer
          description: embedding 必填
        maxTokens:
          type: integer
        temperature:
          type: number
        timeout:
          type: integer
          description: 秒
        isReasoning:
          type: boolean
        thinkingMode:
          type: string
          enum:
          - none
          - auto
          - preset
          - custom
        thinkingPreset:
          type: string
        thinkingPayload:
          type: object
          additionalProperties: true
        isDefault:
          type: boolean
        enabled:
          type: boolean
          default: true
        remark:
          type: string
    ModelUpdateRequest:
      type: object
      description: 部分合并；apiKey 缺席/空串保持原值，clearApiKey=true 清空
      properties:
        modelName:
          type: string
        displayName:
          type: string
        apiModel:
          type: string
        baseUrl:
          type: string
          format: uri
        apiKey:
          type: string
        clearApiKey:
          type: boolean
        chatPath:
          type: string
        embeddingsPath:
          type: string
        modelsPath:
          type: string
        rerankPath:
          type: string
        dimension:
          type: integer
        maxTokens:
          type: integer
        temperature:
          type: number
        timeout:
          type: integer
        isReasoning:
          type: boolean
        thinkingMode:
          type: string
          enum:
          - none
          - auto
          - preset
          - custom
        thinkingPreset:
          type: string
        thinkingPayload:
          type: object
          additionalProperties: true
        isDefault:
          type: boolean
        enabled:
          type: boolean
        remark:
          type: string
    ModelTestRequest:
      type: object
      required:
      - modelKind
      - baseUrl
      description: 与建模型同形；modelName 缺省用 probe
      properties:
        modelKind:
          type: string
          enum:
          - llm
          - embedding
          - rerank
        modelName:
          type: string
        apiModel:
          type: string
        baseUrl:
          type: string
          format: uri
        apiKey:
          type: string
        chatPath:
          type: string
        embeddingsPath:
          type: string
        modelsPath:
          type: string
        rerankPath:
          type: string
        dimension:
          type: integer
    SavedModelTestRequest:
      type: object
      description: 全部字段可选；不提供 apiKey 时服务端丢弃 baseUrl 与各路径，按已保存配置测试（防止用已存密钥请求任意主机）
      properties:
        baseUrl:
          type: string
          format: uri
        apiKey:
          type: string
        chatPath:
          type: string
        embeddingsPath:
          type: string
        modelsPath:
          type: string
        rerankPath:
          type: string
    WorkflowCreateRequest:
      type: object
      required:
      - workFlowId
      - name
      - template
      properties:
        workFlowId:
          type: string
          maxLength: 128
          description: 也接受 workflowId / appId；只允许 [A-Za-z0-9_]
        name:
          type: string
          maxLength: 255
        template:
          type: string
          maxLength: 64
          enum:
          - Sequential
          - Blended
          - Conditional
        knowledgeType:
          type: string
        description:
          type: string
          maxLength: 1000
        boundInfo:
          type: object
          description: 按分组 running/dev 放知识库选项；元素至少带 tableName、embeddingModel、type
          additionalProperties: true
    WorkflowUpdateRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          maxLength: 255
        template:
          type: string
          maxLength: 64
        knowledgeType:
          type: string
        description:
          type: string
          maxLength: 1000
    WorkflowCanvasRequest:
      type: object
      required:
      - nodeConfigDTOList
      - otherNodeConfigList
      properties:
        flowType:
          type: string
        version:
          type: integer
          description: 草稿保存不使用，仅发布推进版本
        nodeConfigDTOList:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: true
          description: 可视节点；data.variables 内放算子
        otherNodeConfigList:
          type: array
          items:
            type: object
            additionalProperties: true
          description: 必须包含 QUERY_ENGINE 节点
    AgentKeyCreateRequest:
      type: object
      required:
      - name
      - scopes
      properties:
        name:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 200
        scopes:
          type: array
          minItems: 1
          items:
            type: string
            enum:
            - kb:list
            - kb:search
            - kb:answer
            - workflow:read
            - workflow:run
        kbIds:
          type: array
          items:
            type: string
          description: 白名单；空数组 = 全部文档库
        rateLimitPerMin:
          type: integer
          minimum: 0
          maximum: 100000
          default: 60
          description: 0 表示不限
        expiresAt:
          type: string
          nullable: true
          description: ISO 8601 或 YYYY-MM-DD；null = 永不过期
    AgentKeyUpdateRequest:
      type: object
      description: 部分更新；expiresAt 显式 null 表示清空过期时间
      properties:
        name:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 200
        scopes:
          type: array
          minItems: 1
          items:
            type: string
            enum:
            - kb:list
            - kb:search
            - kb:answer
            - workflow:read
            - workflow:run
        kbIds:
          type: array
          items:
            type: string
        rateLimitPerMin:
          type: integer
          minimum: 0
          maximum: 100000
        expiresAt:
          type: string
          nullable: true
        enabled:
          type: boolean
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: ragstudio_session
      description: 本地账号登录后由服务端下发的 HttpOnly 会话 Cookie。
  responses:
    Problem:
      description: RFC 9457 问题体
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
servers:
- url: /api/co-knowledge/v1
security:
- cookieAuth: []
