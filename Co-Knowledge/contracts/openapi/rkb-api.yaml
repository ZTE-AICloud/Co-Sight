openapi: 3.0.3
info:
  title: Knowledge Studio API
  description: 'Knowledge Studio 对外 REST API。成功体是纯 JSON（单资源 / 数组 / {items,total,page,pageSize}）；错误是真实
    HTTP 状态码 + RFC 9457 `application/problem+json`。


    协议端点（不属于本 REST 契约）：`POST /query` 的流式模式是标准 SSE、`GET /health` 是纯文本、`/mcp` 是 MCP
    Streamable HTTP（见 `contracts/openapi/agent-api.yaml` 之外另有 MCP 规范）。'
  version: 2.3.0
