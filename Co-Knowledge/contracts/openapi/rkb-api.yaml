      - schema_file
      title: Body_graph_schema_import_api_co_knowledge_v1_graph_schemas_import_post
    Body_operator_import_api_co_knowledge_v1_operators_post:
      properties:
        file:
          type: string
          title: File
          format: binary
      type: object
      required:
      - file
      title: Body_operator_import_api_co_knowledge_v1_operators_post
    ChangePasswordRequest:
      properties:
        currentPassword:
          type: string
          maxLength: 1024
          title: Currentpassword
          default: ''
        newPassword:
          type: string
          maxLength: 1024
          title: Newpassword
          default: ''
      type: object
      title: ChangePasswordRequest
    GraphRetrieveDto:
      properties:
        query:
          type: string
          title: Query
          description: 用于检索的自然语言
        embedding:
          type: string
          title: Embedding
          description: embedding模型服务名称
        bases:
          items:
            type: string
          type: array
          title: Bases
          description: 知识库标识列表
        seed_k:
          anyOf:
          - type: integer
            maximum: 50.0
            minimum: 1.0
          - type: 'null'
          title: Seed K
          description: 种子节点个数
          default: 5
        depth:
          anyOf:
          - type: integer
            maximum: 10.0
            minimum: 1.0
          - type: 'null'
          title: Depth
          description: 种子节点传播的深度
          default: 1
        limit:
          anyOf:
          - type: integer
            maximum: 5000.0
            minimum: 1.0
          - type: 'null'
          title: Limit
          description: 边数预算上限（深图可调大；实体只带返回边端点）
          default: 1000
        score:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Score
          description: 种子节点相似性分数（余弦值）过滤阈值
          default: 0.0
        labels:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Labels
          description: 标签列表，用于前置过滤，最多10个字符串标签
      type: object
      required:
      - query
      - embedding
      - bases
      title: GraphRetrieveDto
      description: 图检索请求DTO
    LoginRequest:
      properties:
        username:
          type: string
          maxLength: 255
          title: Username
          default: ''
        password:
          type: string
          maxLength: 1024
          title: Password
          default: ''
      type: object
      title: LoginRequest
