# Knowledge Studio · web nginx 反向代理
# 上游均为 compose 服务名，运行时经 Docker 内嵌 DNS 动态解析（见下 resolver 说明）。
# 后端只暴露一个前缀 `/api/co-knowledge/v1`，其单点定义见
# `backend/src/shared/prefixes.py`。

server {
    listen 80;
    server_name _;
    server_tokens off;

    # 基础安全响应头（CSP 由部署侧按需追加）。
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 让「超大文件」走到业务侧的友好 JSON 错误，而不是 nginx 默认 1MB 的
    # HTML 413（业务按格式配置的上限 md=100MB/docx=100MB/pdf=150MB/txt=5MB，
    # 高于此值时应由后端判定并返回 problem+json）。
    client_max_body_size 650m;

    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------
    # 文本资源压缩
    #
    # 不压缩时，前端首屏要传 ~2.3MB（vendors 1.40MB + app 0.27MB + CSS 0.56MB），
    # 登录后进文档知识库再传 ~1.7MB（module.kb 1.29MB + CSS 0.32MB）。按 gzip 实测
    # 这三类文本合计 3.98MB → 1.09MB（约 3.7 倍），窄带链路上是「卡住」与「能用」
    # 的差别。
    #
    # `gzip_proxied` 保持默认的 `off`：上游（RKB / SSE）的响应不在这里二次压缩。
    # 尤其 `/query`、`/mcp`、`/agent/query` 三段是 event-stream，压缩会引入缓冲，
    # 反而把「逐字上屏」变成「憋一段再吐」。
    #
    # woff2 本身已压缩，不在 gzip_types 里，避免无意义的 CPU 开销。
    # text/html 由 nginx 隐式包含，不必重复列出。
    # ------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml;

    # Docker 内嵌 DNS。上游容器重启后 IP 会变化，nginx 只有在 proxy_pass 含变量时才会用
    # resolver 按 valid 周期重新解析；否则仅在启动时解析一次，后端重启即持续 502。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 子路径部署入口跳转：根路径构建时该 include 为空文件；
    # 子路径构建时由 Dockerfile 写入 `location = /`（302 到站点）等规则。
    include /etc/nginx/snippets/web-base-redirect.conf;

    # 前端 SPA 路由回退。
    # `__WEB_BASE__` 由 Dockerfile 在构建期替换：根路径 = `location /`，
    # 子路径 = `location /co-knowledge/`。静态文件按同一路径放置，
    # 因此这里用 root 即可，不需要 alias。
    location __WEB_BASE__ {
        # HTML 入口不缓存；带 hash 的静态资源由下面的正则 location 长缓存。
        expires -1;
        try_files $uri $uri/ __WEB_BASE__index.html;
    }

    # 带 hash 的静态资源可长缓存；文件名变化即失效。
    location ~* \.(?:js|css|woff2?|png|jpe?g|svg|ico)$ {
        expires 1y;
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # 检索编排的提问端点（「对话测试」页 /chat）—— **必须单独一段**
    #
    # nginx 的 location 取**最长前缀匹配**，所以本段优先于下面的 `/api/co-knowledge/v1/`，
    # 与书写顺序无关。
    #
    # 为什么不与下面合成一段：这组 SSE 专项配置（尤其 `proxy_buffering off` 与
    # `Connection ""`）套到 650MB 上传、算子包 ZIP、附件下载全链上没有意义，
    # 且清空 Connection 对 keep-alive 有副作用。
    # ------------------------------------------------------------------
    location /api/co-knowledge/v1/query {
        include /etc/nginx/snippets/rkb-sse-proxy.conf;
    }

    # ------------------------------------------------------------------
    # 本地账号登录（`/api/co-knowledge/v1/auth/*`）
    #
    # 请求体只有账号/口令，在边缘就把上限压到 8k：未认证的大 body 不该被读进
    # 后端内存。后端 /auth/login|password 还有一层 Content-Length 检查（直连场景）。
    # ------------------------------------------------------------------
    location /api/co-knowledge/v1/auth/ {
        set $rkb_upstream rag-knowledge-base:8091;
        proxy_pass http://$rkb_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 8k;
    }

    # ------------------------------------------------------------------
    # Agent MCP（Streamable HTTP）：`/api/co-knowledge/v1/mcp`
    #
    # 与 `/query` 同款 SSE 专项配置：MCP 的 initialize / tools/call 可能以
    # `text/event-stream` 分帧返回；不关缓冲会表现为「客户端卡住直到超时」。
    # 用前缀 location（不加 `=`）容忍客户端带不带尾部斜杠。
    # ------------------------------------------------------------------
    location /api/co-knowledge/v1/mcp {
        include /etc/nginx/snippets/rkb-sse-proxy.conf;
    }

    # ------------------------------------------------------------------
    # Agent 工作流执行：`/api/co-knowledge/v1/agent/query`
    #
    # 与原生 `/query` 同款 SSE 配置（关缓冲、HTTP/1.1、长读超时）。必须用更长的
    # 前缀单独一段：下面的 `/agent/` 只管 JSON，不关缓冲；SSE 被缓冲会表现为
    # 「卡住不动、然后一次性全出来」。
    # ------------------------------------------------------------------
    location /api/co-knowledge/v1/agent/query {
        include /etc/nginx/snippets/rkb-sse-proxy.conf;
    }

    # ------------------------------------------------------------------
    # Agent REST facade：`/api/co-knowledge/v1/agent/*`
    #
    # 答案生成默认 120s，通用 location 的 nginx 默认读超时只有 60s，会把长答案
    # 截成 504（症状：后端日志显示生成成功、Agent 收到网关错误）。这里只放长超时，
    # JSON 响应不需要关缓冲。
    # ------------------------------------------------------------------
    location /api/co-knowledge/v1/agent/ {
        set $rkb_upstream rag-knowledge-base:8091;
        proxy_pass http://$rkb_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ------------------------------------------------------------------
    # 后端唯一对外前缀：RKB
    #
    # 知识库 / 文件 / 目录 / 切片 / 检索 / 图谱 / 算子 / 画布编排 全在这里。
    #
    # ⚠️ **少了这一段**，浏览器打任何后端路径都会落到上面的 `location /`，拿到一个
    # **200 的 index.html** —— 前端只报「网络错误」，没有任何线索指向 nginx 配置。
    # 这条坑在收敛前后同样成立，改了前缀务必同时改这里。
    # ------------------------------------------------------------------
    location /api/co-knowledge/v1/ {
        set $rkb_upstream rag-knowledge-base:8091;
        proxy_pass http://$rkb_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 大文件上传（pdf 150MB / zedx 650MB）：nginx 默认 60s 的收发/读超时
        # 会在慢网络或后端落盘 + 建任务期间回 504，前端只看到「网关超时」。
        # 与 agent 段保持一致，给到 300s；客户端分片之间的空闲也一并放宽。
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        client_body_timeout 300s;
    }
}
