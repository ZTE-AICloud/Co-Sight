# SSE 反代的共享片段：编排问答（原生 /query、Agent /agent/query）与 MCP。
#
# 三条路径都必须：
#   - 长读超时（答案生成默认 120s，留到 300s）；
#   - 关响应缓冲（否则 token 会攒到最后一次性下发）；
#   - HTTP/1.1 + 清空 Connection（上游保持长连接）。
#
# 由各 location 里的 `include /etc/nginx/snippets/rkb-sse-proxy.conf;` 引入。
set $rkb_upstream rag-knowledge-base:8091;
proxy_pass http://$rkb_upstream$request_uri;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

proxy_connect_timeout 10s;
proxy_send_timeout 300s;
proxy_read_timeout 300s;

proxy_buffering off;
proxy_cache off;
proxy_http_version 1.1;
proxy_set_header Connection "";
