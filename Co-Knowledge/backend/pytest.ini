# pytest.ini
[pytest]
# `src` 是**唯一** import 根；领域包（knowledge_base/graph/operators/workflow/
# engine/chat/model/retrieval/agent/ingestion/system）与 infrastructure/shared
# 全部在 src/ 下。
pythonpath = src

# 所有纯单测都收在 tests/（含 tests/engine）。它们要能在「装了 fastapi/pytest」
# 的轻量环境里跑完。
#
# 有意**不含** src/ingestion/tests：那些用例要容器与重依赖（沙箱子进程、真实解析链），
# 是独立入口，塞进来会让 `pytest` 一条命令既跑不快也不稳。
testpaths = tests

# ---------------------------------------------------------------------------
# 7 条**差分用例**（`markers` 里的 `baseline_differential`）需要旧实现基线才能跑 ——
# 基线不在依赖里，默认必须**不收集**它们。
#
# 为什么用 deselect 而不是它们自己 skip：
#   CI 与 tools/run-tests.sh 都断言「skip 数 == 0」（防"工作树不完整导致用例被静默跳过"），
#   永久 skip 会让这条护栏失效、并留下永不执行的假覆盖。
#   deselect 不进 skip 计数，护栏原样有效。
#
# 需要重跑差分时（需自备含旧实现的基线镜像）：
#   docker run --rm -v $PWD:/repo -w /repo/backend \
#     -e PYTHONPATH=/repo/backend/src <baseline-image> \
#     sh -c 'pip install -q pytest; python -m pytest -q -m baseline_differential'
# 命令行显式给 -m 会覆盖这里的 addopts（pytest 取最后出现的 -m）。
# ---------------------------------------------------------------------------
addopts = -m "not baseline_differential"
markers =
    baseline_differential: 需要 llama-index 在场的差分用例（只在基线镜像里显式跑；见上）
