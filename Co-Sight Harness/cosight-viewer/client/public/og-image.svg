<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Co-Sight Viewer — agent observability">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
