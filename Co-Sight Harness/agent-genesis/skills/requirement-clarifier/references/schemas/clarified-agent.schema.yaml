# clarified-agent-requirements.yaml — agent 模式需求澄清产出（Skill 私有 schema）
# 唯一权威: workflow-agent.md 阶段 4
# 来源: 原 schemas/clarified-requirements.schema.yaml (v0.18 迁移至本 Skill 目录)
# 引用方: pattern-matcher / build-planner / agent-executor (P10.5 agent 字段名)

task_mode:
  type: string
  enum: [exploration_definition, implementation_construction, verification_validation, efficiency_infrastructure, consensus_communication, monitoring_response, fault_diagnosis_recovery, change_execution, information_processing, scheduling_coordination, retrieval_integration, hybrid]
  description: "判定的任务模式"
why:
  user_role: "string"
  business_scenario: "string"
  core_pain_points: ["string"]
  expected_value: "string"
  success_metrics: ["string"]
what:
  core_flow: "string"
  scope_boundaries: "string"
  priority: "must | should | could | wont"
how:
  normal_flow: "string"
  exception_flow: "string"
  business_rules: ["string"]
quality:
  performance: "string"
  security: "string"
  availability: "string"
acceptance_criteria:
  type: array
  items:
    given: "string"
    when: "string"
    then: "string"
open_questions:
  type: array
  items:
    question: "string"
    recommendation: "string"
    status: "resolved | pending | blocked"
knowledge_sources:
  type: array
  items:
    type: "K1 | K2 | K3 | K4"
    location: "string"
    trust_level: "权威 | 参考 | 待确认"
confidence:
  type: integer
  minimum: 0
  maximum: 100
build_mode:
  type: string
  enum: [greenfield, incremental]
dc010_channel:
  type: string
  enum: [fast, full]
# ── 宿主语境三段（host-context 方案 §3.2; 全部可选——存量 fixture 缺字段合法,
#    消费方以"字段存在才消费"为契约; 普通代码仓/抑制场景可整段省略）──
intent:
  type: string
  enum: [host_extend, modify_existing, explicit_create]
  description: "宿主语境意图判定（阶段 1 语义判定; host_extend=项目内增补, 与'修改当前项目'同语境）"
target_match:
  type: object
  properties:
    detected: {type: boolean}
    matched_targets:
      type: array
      items:
        name: "string"
        path: "string"
        kind: "agent | skill"
        similarity_evidence: "string"
    suggested_route:
      type: string
      enum: [optimize, create_replace, create_new]
  description: "需求与宿主已有资产的相关性判定; detected=true 时 matched_targets 非空"
project_context:
  type: object
  properties:
    in_project: {type: boolean}
    project_kind:
      type: string
      enum: [claude_code, dsh, none]
    summary: {type: "string"}
    conventions: {type: array, items: "string"}
    relevant_assets:
      type: array
      items:
        path: "string"
        kind: "string"
        role: "string"
    suppressed_by: {type: "string"}
  description: "宿主项目画像（探针 host_project 段 + 阶段 1 探索摘要）; 抑制场景 = {in_project: false, project_kind: none, suppressed_by: non_interactive}"
