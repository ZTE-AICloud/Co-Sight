# AgentGenesis 模式匹配知识库
# 用于 Creator Phase 1: LLM 读取此文件，基于语义理解将用户需求映射为设计模式
#
# 设计原则：LLM 做匹配推理，不做关键词穷举。
# 每个模式描述其"解决什么问题"和"与其他相似模式的区别"，
# LLM 基于语义理解（而非关键词命中）决定匹配哪个模式。
#
# 使用方式：将此文件作为 AgentGenesis prompt 的上下文，
# LLM 阅读用户需求后，逐子维度推理决策，输出子维度决策表。

# ============================================================
# 匹配指南：LLM 如何做决策
# ============================================================
matching_guide: |
  你是一个 Agent 架构设计专家。你的任务是将用户的自然语言需求映射到设计模式。

  对于每个子维度，请按以下步骤推理：
  1. 阅读该子维度下每个模式解决的问题（solves）和典型特征（typical_indicators）
  2. 阅读该模式与其他相似模式的区别（distinguishing_from）
  3. 基于用户需求的语义理解（而非关键词匹配），判断哪个模式最匹配
  4. 如果无法确定（多种可能、或信号不清晰），在 clarification_needed 中标注追问问题
  5. 输出决策表和置信度

  置信度指南：
  - high: 用户需求的语义明确指向该模式，无需追问
  - medium: 存在一定歧义或可能被多个模式覆盖，建议追问确认
  - low: 信号很弱或完全缺失，必须追问

  注意：不要依赖特定关键词。用户可能用完全不同的措辞表达相同的架构需求。
  例如"先A后B再C"和"第一步做A，等A完成后再做B，最后用C收尾"表达的是同一个 Pipeline 模式。

# ============================================================
# 子维度 1: 工作流-分解模式 (4选1, 互斥)
# ============================================================
workflow_decomposition:
  selection_rule: "4选1互斥（W1/W2/W3/W4）。一个Agent顶层只能选一种。W5(Adaptive)为可选叠加层（不参与互斥），选中时必须声明 base_topology（W1/W2/W3/W4 之一）。子结构可嵌套另一种(最大深度2层)。G1为质量门禁叠加（见本节末尾 G1_note）。WF4-WF7为扩展参考（不在 27 模式 catalog 内，不参与选择，选中将触发 G017 L2 FAIL）。"

  W1:
    name: "Pipeline（管道式）"
    solves: >
      任务可以预先分解为固定数量和顺序的步骤。步骤之间有明确的先后依赖——
      上一步的输出是下一步的输入。整个流程像一个生产线，每一站有明确的职责。
      步骤顺序不可变更，不可跳过，不可并行。
    typical_indicators: >
      用户描述了多个阶段/步骤，并用顺序逻辑（先...后...最后/接着/然后/完成X后做Y）连接。
      步骤之间有数据传递关系（A的结果给B用）。整个流程的结构在开始前就已经清楚了。
    distinguishing_from:
      W2: "Pipeline的步骤是固定顺序的、预先可知的；Router的路径取决于输入类型，需要在入口处做条件判断分流。如果用户说'根据X的类型决定走哪条路'，那是Router不是Pipeline。"
      W3: "Pipeline的步骤是串行的、有顺序依赖的；Map-Reduce的子任务相互独立、可以同时进行。如果用户说'A和B互不影响、可以分别做'，那是Map-Reduce不是Pipeline。"
      W4: "Pipeline的步骤在构建时就确定了数量和顺序；Leader-Worker的步骤在运行时根据输入内容动态决定。如果用户说'看情况可能需要也可能不需要某个步骤'，那是Leader-Worker不是Pipeline。"
    clarification_needed: >
      用户描述了多个任务但未说明是否有先后依赖 → 追问："这些任务是必须按顺序执行，还是可以同时进行？"
  W2:
    name: "Router（路由式）"
    solves: >
      不同的输入类型需要不同的处理路径。入口处需要一个"判断-分流"逻辑——
      根据输入的某个特征（类型、复杂度、来源）决定走哪条处理路径。
      路径之间相互独立，一次执行只走一条路径。
    typical_indicators: >
      用户描述了条件逻辑："如果/当/根据X的类型/分情况"。入口统一但后续分叉。
      不同场景有不同的处理流程。存在明确的分类标准和对应的处理策略。
    distinguishing_from:
      W1: "Router在入口处做条件判断后分流；Pipeline是固定的串行序列。Router的不同路径之间是'或'的关系，Pipeline的步骤之间是'且'的关系。"
      W3: "Router的不同路径是互斥的（一次只走一条）；Map-Reduce的子任务是并行的（同时做多条）。如果所有分支都要执行，那是Map-Reduce不是Router。"
      W4: "Router的路径在构建时已预定义（虽然运行时选择走哪条）；Leader-Worker的Worker在运行时才创建。"
    clarification_needed: >
      用户说"不同的X有不同的处理方式"但未说明X是什么 → 追问："根据什么标准来判断走哪条处理路径？"

  W3:
    name: "Map-Reduce（映射-归约式）"
    solves: >
      多个同类型的子任务，它们之间没有依赖关系，可以同时并行执行。
      所有子任务完成后，需要一个汇总步骤将结果整合为最终输出。
    typical_indicators: >
      用户描述了多个可以"同时/分别/并行/独立"进行的任务。子任务结构相似但输入不同。
      最后有一个汇总/合并/综合的步骤。子任务之间明确说了"互不影响"或"没有依赖"。
    distinguishing_from:
      W1: "Map-Reduce的子任务并行且独立；Pipeline的步骤串行且有依赖。关键是子任务之间是否可以同时做。"
      W2: "Map-Reduce的所有子任务都会执行并汇总；Router只走一条路径。如果用户说'根据情况决定做哪个'，是Router；如果说'这几个都要做'，更接近Map-Reduce。"
      W4: "Map-Reduce的子任务类型在构建时已知（即使数量可变）；Leader-Worker的Worker类型在运行时动态决定。"
    clarification_needed: >
      用户描述多个任务但未说明是否有依赖 → 追问："这些任务之间有没有先后依赖？可以同时进行吗？"
      用户说"分别做"但可能是指"按顺序分别做" → 追问澄清并行还是串行。

  W4:
    name: "Leader-Worker（领导-工人式）"
    solves: >
      任务在运行时才知道如何拆解——需要 Leader 先分析输入，再动态派生 Worker 执行。
      Worker 基于模板实例化，不可从零创建。
    typical_indicators: >
      用户说"看情况拆分""根据需要生成子任务""先分析再决定怎么做"。
      子任务的数量和类型在运行时才确定。存在"分析→派生→汇总"的结构。
    distinguishing_from:
      W1: "Pipeline的步骤构建时就确定了数量和顺序；Leader-Worker的步骤在运行时根据输入内容动态决定。如果用户说'看情况可能需要也可能不需要某个步骤'，那是Leader-Worker不是Pipeline。"
      W3: "Map-Reduce的子任务类型在构建时已知（即使数量可变）；Leader-Worker的Worker类型在运行时动态决定。"
    clarification_needed: >
      用户说"可能会需要多个子任务" → 追问："子任务的类型是预先知道的几种，还是分析完之后才能决定？"

  # 叠加层与门禁（不参与 4选1 互斥）
  W5_note: "W5-Adaptive: 叠加层，包装 W1-W4。选中时决策必须含 base_topology 声明（HC-03）。"
  G1_note: "G1-Reviewer-Gate: 质量门禁叠加，可叠加到任意分解模式（catalog overlay_rules: 每步/每分支/每子任务/每Worker 后插入审查）。"

  G1:
    name: "Reviewer-Gate（审查门禁）"
    solves: >
      每个步骤的产出需要经过独立质检才能传递给下一步。
      审查方和执行方是不同角色——不能让执行者自己审查自己的输出。
      审查不通过需要修正后重新提交，连续不通过最终阻断。
    typical_indicators: >
      用户说"每步都要审查/检查/验证/确认"、"审查不通过要重做/打回"。
      用户关心输出质量，要求有独立的检查机制。流程中明确有"质检"环节。
    distinguishing_from: >
      不是每个Agent都需要G1。只有当用户明确要求"独立的"检查步骤时才启用。
      如果用户只是说"确保输出正确"，这可能是约束而非门禁——追问澄清。
      如果用户说"最后检查一下就行"，那是终点检查（属于W1的最后一个Step），不是G1（每步检查）。
    clarification_needed: >
      用户说"确保质量"但未说明检查方式 → 追问："是每步完成后都检查，还是最后检查一次就够了？检查由谁来做——Agent自己还是另一个独立的Agent？"

# ============================================================
# 子维度 3: 工作流-状态管理 (可选叠加)
# ============================================================
workflow_state_management:
  selection_rule: "可选。可叠加到 W1-W4 任意分解模式之上。推荐搭配 DT1 + DF1。"

  K1:
    name: "LLM-Native（模型内嵌知识）"
    solves: >
      任务所需知识属于LLM训练数据的覆盖范围——通用编程概念、常见分析框架、
      标准写作规范等，不需要外部参考资料。
    typical_indicators: >
      用户描述的领域属于通用知识（而非特定公司/行业的专有知识）。
      用户没有提到任何外部文档、知识库、或规则文件。
    distinguishing_from: >
      选择K1不意味着禁止外部参考——它只是说"基础推理依赖LLM即可"。
      如果用户后续提到"但XX必须按文档来"，此时K1退为辅助，K2升为主要来源。
    clarification_needed: >
      用户完全没提知识来源 → 追问："这个任务是否需要参考特定的文档、规范或知识库？还是通用知识就够？"
      （这是最常见的追问场景——很多用户默认Agent"自己知道"而不提知识依赖）

  K2:
    name: "Document-Grounded（文档锚定）"
    solves: >
      推理必须基于用户提供的特定文档。文档是推理的权威来源——每一句结论
      都需要能从文档中找到依据。不能用LLM内嵌知识替代文档内容。
    typical_indicators: >
      用户说"根据XX文档/规范/协议/设计文件来分析"、"以XX为准"。
      文档内容是推理的唯一或主要依据。领域知识属于特定文档而非通用知识。
    distinguishing_from:
      K3: "K2是单份特定文档（全文读取）；K3是可检索的结构化知识库（按需检索Top-K）。关键区别：知识量是否需要检索（K3）还是全文读完就行（K2）。"
      K4: "K2的文档是叙述性的参考材料；K4的规则文件是结构化的判定标准。K4告诉你'什么是合规的'，K2告诉你'这个领域是怎么样的'。"

  K3:
    name: "KB-Backed（知识库支撑）"
    solves: >
      知识存放在结构化知识库中，量大无法全部放入上下文。
      需要通过检索（Embedding/图遍历/SQL等）找到最相关的条目后注入上下文。
    typical_indicators: >
      用户说"从知识库中查/检索/搜索"、"查询历史案例/场景库"。
      知识量明显超过上下文窗口。需要按相似度/相关性筛选。
    distinguishing_from:
      K2: "K3是检索型（量太大需要筛选Top-K）；K2是全文型（整个文档相关）。如果用户说'查一下知识库'，是K3；如果说'读完这个文档'，是K2。"
      K4: "K3的检索结果是参考性的（帮助理解）；K4的规则应用是约束性的（决定做不做）。"

  K4:
    name: "Rule-Driven（规则驱动）"
    solves: >
      Agent的行为受外部规则文件约束——命名标准、判断阈值、分类标准等。
      规则变更时不需要修改Agent定义，只需更新规则文件。
    typical_indicators: >
      用户说"按标准表/规则表来判断"、"命名必须匹配XX表"、"阈值在配置文件中"。
      存在明确的、结构化的判定标准（通常是表格或字典形式）。
    distinguishing_from:
      K2: "K4是结构化的判定规则（通常是可以查表确定）；K2是叙述性的参考文档。例如：'3GPP协议规范'是K2，'标准场景名映射表'是K4。"
      K3: "K4的规则是严格匹配的（精确查找）；K3的检索是相似性的（语义匹配Top-K）。"

# ============================================================
# 子维度 5: 数据-拓扑 (可混合)
# ============================================================
data_topology:
  selection_rule: "可混合使用。DT1和DT2通常同时出现。"

  DT1:
    name: "Linear-Pass-Through（链式传递）"
    solves: >
      数据在步骤间像流水线一样逐级传递。每一步的输出是下一步的输入。
      数据流是单向的、链式的：A→B→C→D。
    typical_indicators: >
      用户描述的步骤之间有明确的数据传递关系。上一步的产出被下一步消费。
      "X的输出给Y用"、"基于X的结果做Y"。
    distinguishing_from:
      DT2: "DT1是纵向的（步骤N的产出→步骤N+1的输入）；DT2是横向的（多个组件共享同一个状态）。大多数系统两者都需要。"

  DF1:
    name: "Schema-Enforced（格式约束）"
    solves: >
      数据的结构和类型有严格要求。每步输出必须通过JSON Schema校验。
      非结构化数据不能传递给下游——强制程序化消费。
    typical_indicators: >
      用户说"输出必须是XX格式"、"结构化输出"、"Schema定义"。
      数据需要被下游程序自动化处理（非人工阅读）。
    distinguishing_from: >
      不是所有结构化输出都需要DF1。如果用户只是说"输出一个表格"，那是格式要求，
      可以放在I/O Contract中，不需要DF1。DF1的核心是"Schema校验+阻断不符合的输出"。

# ============================================================
# 子维度 7: 数据-溯源 (可选)
# ============================================================
data_provenance:
  selection_rule: "可选。叠加到任意数据拓扑之上。"

  DP1:
    name: "Traceable-Lineage（可追溯溯源）"
    solves: >
      输出的每条结论必须能追溯到输入来源——哪个文档的哪个段落、
      哪个步骤产生了这个结论、推理路径是什么。
    typical_indicators: >
      用户说"要知道结论从哪里来的"、"可追溯/可审计"。
      场景有合规/审计要求。输出会被下游质疑或审查，需要自证来源。
    distinguishing_from: >
      K2的"引用文档段落"和DP1的"标注来源步骤"是互补的：K2要求"从哪份文档来"，
      DP1要求"从哪个步骤来"。两者可以共存。

# ============================================================
# 子维度 8: 交互-人机 (可按阶段混合)
# ============================================================
interaction_human:
  selection_rule: "可按阶段混合使用。例如：规划阶段用IH3(Plan-Approval)，执行阶段用IH1(Fire-and-Forget)。"

  IH1:
    name: "Fire-and-Forget（提交即忘）"
    solves: >
      输入给完整，执行过程不需要中断与用户对话。整个执行过程是批处理式的。
    typical_indicators: >
      用户说"给输入就给出输出"、"不需要中间确认"。
      任务像一个函数调用：输入确定→输出确定。
    distinguishing_from:
      IH2: "IH1假设输入已经完整；IH2假设输入可能不完整，需要追问。如果用户没提，默认用IH2（更安全）。"

  IH2:
    name: "Interactive-Clarify（交互澄清）"
    solves: >
      初始信息可能不完整或有歧义。在执行过程中需要主动向用户追问缺失信息。
    typical_indicators: >
      用户说"如果信息不全就问"、"需要澄清"。
      输入质量不确定，可能需要多轮对话才能完整。
    distinguishing_from:
      IH3: "IH2追问的是缺失的输入信息；IH3确认的是执行方案。IH2是'我还需要什么'，IH3是'我打算这么做，对吗'。"

  IH3:
    name: "Plan-Approval（方案审批）"
    solves: >
      执行前先把方案给用户过目确认——执行成本高、回滚困难、或方案有多个可选路径。
      避免方向性错误：宁可多一步确认，也不要在错误方向上执行到底。
    typical_indicators: >
      用户说"先给我看看方案/计划"、"确认后再执行"。
      任务成本高（耗时/资源/影响力大）。关键决策点需要人工把关。

# ============================================================
# 子维度 9: 交互-工具策略 (3选1)
# ============================================================
interaction_tool_strategy:
  selection_rule: "3选1。默认Tool-Optional（可选使用工具）。"

  IT1_Enforced:
    name: "Tool-Orchestrated Enforced（强制工具编排）"
    solves: >
      核心能力不内嵌在Prompt中，必须通过外部工具/Skill/SubAgent完成。
      例如："协议分析必须通过Skill完成"——禁止LLM自行分析。
    typical_indicators: >
      用户说"必须通过XX工具/Skill完成"、"严禁自行分析"、"必须调用XX"。
      任务的正确性由工具保障而非LLM推理。
    distinguishing_from:
      IT1_Optional: "Enforced意味着不使用工具会出错（如幻觉）；Optional意味着工具是辅助但不是必需的。"

  IT1_Optional:
    name: "Tool-Orchestrated Optional（可选工具）"
    solves: >
      工具/Skill可以辅助完成任务，但不是强制依赖。Agent可自行判断何时调用。
    typical_indicators: >
      用户说"可以用XX工具/功能"、"支持XX"。工具是辅助性的，Agent可自行决定。
    distinguishing_from:
      IT1_Enforced: "Optional是'有更好，没有也行'；Enforced是'没有不行'。"

  Tool_Forbidden:
    name: "Tool-Forbidden（禁止工具）"
    solves: >
      纯推理任务，不需要也不应该调用外部工具。
    typical_indicators: >
      用户说"纯推理/分析就行"、"不要调用工具"。任务完全在LLM能力范围内。

# ============================================================
# 子维度 10: 交互-可见性 (可选)
# ============================================================
interaction_visibility:
  selection_rule: "可选。独立于其他交互子维度。"

  IV1:
    name: "Progress-Streaming（进展汇报）"
    solves: >
      执行过程超过几十秒，用户需要知道当前进度——做到哪了、卡在哪里、
      还需要等多久。
    typical_indicators: >
      用户说"持续汇报进度"、"让我知道进展"。
      流程有多个阶段/步骤，整体耗时预计超过1分钟。
    distinguishing_from: >
      短流程不需要IV1。如果只有1-2个步骤且预计10秒内完成，IV1是过度设计。
      判断标准：用户会不会因为"看不到进度"而焦虑或中断执行。

# ============================================================
# 子维度 11: 约束-域模板 (可选, 多选)
# ============================================================
constraint_domain_templates:
  selection_rule: "可选，可多选。域模板是预置的约束规则集，提供基线。用户可增删规则。"

  CD1:
    name: "Input-Gating（输入门禁）"
    solves: >
      在执行前必须确认所有关键输入文件存在且可读。
      输入缺失会导致后续全错——先检查再执行，比执行到一半才发现缺失好得多。
    typical_indicators: >
      用户说"缺少XX就不能启动"、"必须有XX才能开始"。
      输入来自外部系统或用户文件，存在"可能还没准备好"的风险。

  CD2:
    name: "Safety-First（安全优先）"
    solves: >
      安全敏感场景——操作权限需要额外约束。不能修改源代码、不能操作数据库、
      不能访问生产环境等。需要沙箱隔离。
    typical_indicators: >
      用户说"不要修改源码"、"不能碰数据库"、"不要联网"。
      场景涉及生产系统或不可逆操作。

  CD3:
    name: "Knowledge-Boundary（知识边界）"
    solves: >
      明确区分：哪些领域可以信任LLM内嵌知识，哪些必须从外部检索。
      防止LLM在垂直领域产生幻觉——"不要猜，去查"。
    typical_indicators: >
      用户说"不要猜/不要编"、"去查/检索"、"协议细节必须……"。
      领域有高准确性要求且LLM训练数据不可靠（垂直领域、专有数据）。
    distinguishing_from:
      "CD3本身不是知识来源——它是对K1的约束：'在域X中，禁止使用K1'。因此选择CD3时必须同时选择至少一个替代来源（K2/K3/K4）。"

# ============================================================
# 子维度 12: 自进化 (依赖链)
# ============================================================
evolution_self:
  selection_rule: "依赖链。E2依赖E1，E3依赖E2+E1。不可跳跃选择。"

