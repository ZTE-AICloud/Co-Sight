# 契约见 schemas/golden-manifest.schema.yaml（字段语义单点在该文件）

task_tag: leader-worker-orchestrator
line: agent
mode_id: WF5-Contract-Lock              # 货架位（检索键）, 非身份声明（R9）
patterns:                               # 如实完整模式维度集（现行词汇, 重映射后）
  - WF5-Contract-Lock
  - K4-Rule-Driven
  - WF6-Circuit-Breaker
  - DT1-Linear-Pass-Through
