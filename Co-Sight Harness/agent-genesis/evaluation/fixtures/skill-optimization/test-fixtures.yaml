# Skill 优化能力 — 测试 Fixture 定义

> 覆盖: 6 诊断维度、11 优化模式、多 Skill 场景、边界判定

## Fixture 1: 健康 Skill — 基线测试

```yaml
fixture_id: "F-SO-001"
fixture_type: "healthy_baseline"
skill_path: "F-SO-001-healthy/SKILL.md"
description: "符合 Anthropic 规范的健康 Skill，应全部 PASS"
expected:
  all_dimensions_pass: true
  diagnosis:
    decomposition: PASS
    information: PASS
    state: PASS
    verification: PASS
    design_form: PASS
    global_context: PASS
  boundary_decision: SKILL_ONLY
  selected_pattern_count: 0  # 无需优化
```

## Fixture 2: 单体过载 — Decomposition FAIL

```yaml
fixture_id: "F-SO-002"
fixture_type: "decomposition_fail"
skill_path: "F-SO-002-monolithic/SKILL.md"
description: "12 步骤无 I/O 契约无模块隔离，应触发模式 1 (单体拆解)"
expected:
  diagnosis:
    decomposition:
      status: FAIL
      severity: HIGH
      signals: ["步骤数量 >= 8", "无 I/O 契约", "步骤间无模块隔离"]
    information: PASS
    state: FAIL  # 中间步骤产物不可追溯
    verification: FAIL  # 无校验门禁
    design_form: FAIL  # 缺少 references/ 分层
    global_context: PASS
  boundary_decision: SKILL_ONLY
  selected_patterns_include: [1]  # 单体拆解
  selected_patterns_exclude: [7]  # 不需要形态重构(问题在分解不在形态)
```

## Fixture 3: 知识全内联 — Information FAIL

```yaml
fixture_id: "F-SO-003"
fixture_type: "information_fail"
skill_path: "F-SO-003-no-references/SKILL.md"
description: "12 类安全检查知识全部内联在 SKILL.md，无 references/ 提取，应触发模式 2 (文档系统)"
expected:
  diagnosis:
    decomposition: PASS
    information:
      status: FAIL
      severity: HIGH
      signals: ["知识 >500 行内联", "无外部 references/ 引用", "缺少 K2/K3 知识源"]
    state: PASS
    verification: PASS
    design_form: FAIL  # 无 references/ 也无 scripts/
    global_context: PASS
  boundary_decision: SKILL_ONLY
  selected_patterns_include: [2, 7]  # 文档系统 + 形态重构
```

