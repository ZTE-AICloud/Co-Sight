## Fixture 5: 无校验门禁 — Verification FAIL

```yaml
fixture_id: "F-SO-005"
fixture_type: "verification_fail"
skill_path: "F-SO-005-no-g1/SKILL.md"
description: "自审代替独立审查 + 输出到 /tmp/ + 无 Schema 约束，应触发模式 3+4+6+8"
expected:
  diagnosis:
    decomposition: PASS
    information: PASS
    state: PASS
    verification:
      status: FAIL
      severity: CRITICAL
      signals: ["自审代替独立审查", "输出格式无 Schema"]
    design_form: FAIL  # description 过于简单
    global_context:
      status: FAIL
      severity: HIGH
      signals: ["输出路径 /tmp/ 与 Agent work/ 约定不符", "自审绕过 Agent G1"]
  boundary_decision: SKILL_ONLY  # 可在 Skill 内修正
  selected_patterns_include: [4, 6, 8]  # Hook 门禁 + Review Agent + 全局对齐
```

## Fixture 6: 设计形态差 — Design Form FAIL

```yaml
fixture_id: "F-SO-006"
fixture_type: "design_form_fail"
skill_path: "F-SO-006-bad-form/SKILL.md"
description: "名称宽泛(helper)、description 模糊、代码内联在 Markdown、无分层，应触发模式 7 (形态重构)"
expected:
  diagnosis:
    decomposition: PASS
    information: PASS
    state: PASS
    verification: PASS
    design_form:
      status: FAIL
      severity: HIGH
      signals:
        - "名称过于宽泛 (helper)"
        - "description 缺少触发条件"
        - "代码示例内联在 SKILL.md"
        - "无 references/ 目录"
        - "无 scripts/ 目录"
        - "无 templates/ 目录"
        - "SKILL.md 中嵌入可执行 Python 代码"
    global_context: PASS
  boundary_decision: SKILL_ONLY
  selected_patterns_include: [7]  # 形态重构
  anthropic_violations:
    - SF-1  # 目录结构
    - SF-5  # 命名约定
    - SF-6  # 描述公式
    - SF-7  # 脚本独立
```

## Fixture 7: Agent 对齐偏离 — Global Context FAIL

```yaml
fixture_id: "F-SO-007"
fixture_type: "global_context_fail"
skill_path: "F-SO-007-agent-misaligned/SKILL.md"
description: "Skill 修改源代码(违反S-01)、自审代替G1(违反S-02)、输出到/tmp/(违反work/约定)、修改任意文件(越权)"
expected:
  diagnosis:
    decomposition: PASS
    information: PASS
    state: PASS
    verification: FAIL  # 自审代替独立审查
    design_form: FAIL    # description 模糊
    global_context:
      status: FAIL
      severity: CRITICAL
      signals:
        - "GC-1 Role 不一致: 修改源代码 vs Agent 仅分析"
        - "GC-2 Tool 权限: Edit 不在 Agent 白名单"
        - "GC-3 I/O 路径: /tmp/ 与 work/ 约定不符"
        - "GC-4 Safety: 违反 S-01 禁止修改源代码"
        - "GC-7 Review: 自审绕过 G1 审查门禁"
  boundary_decision: PARTIALLY_EXCEEDED  # Tool 权限需 Agent 级修改
  agent_issues:
    - "Tool 权限: 需要 Edit 工具，但 Agent 白名单不含"
  selected_patterns_include: [8]  # 全局对齐
```

## Fixture 8: 巨型 Skill — 应拆分

```yaml
fixture_id: "F-SO-008"
fixture_type: "mega_skill_split"
skill_path: "F-SO-008-mega-skill/SKILL.md"
description: ">800 行 CI/CD Skill，含 6 Phase 25+ 步骤，应触发模式 9 (Skill 拆分) + 调用流变更提示"
expected:
  diagnosis:
    decomposition:
      status: FAIL
      severity: CRITICAL
      signals: ["行数 >800", "6 个功能域", "步骤数量 >= 25"]
    information: FAIL  # 大量知识内联
    state: FAIL  # 无 checkpoint
    verification: PASS
    design_form: FAIL  # 无分层
    global_context: PASS
  boundary_decision: SKILL_ONLY
  selected_patterns_include: [9, 2, 5]  # 拆分 + 文档系统 + 状态追踪
  split_recommended: true
  estimated_sub_skills: 6  # 按 Phase 拆分
  call_flow_changes_required: true
```

## Fixture 9+10: 多 Skill 关联 — 重叠 + 依赖

```yaml
fixture_id: "F-SO-MULTI-001"
fixture_type: "multi_skill_overlapping"
skill_paths:
  - "F-SO-008-mega-skill/SKILL.md"   # CI/CD 全流程 — 含依赖扫描和许可证检查
  - "F-SO-009-overlapping/SKILL.md"  # 与 F-SO-008 Phase 1.5 重叠
  - "F-SO-010-dependent/SKILL.md"    # 依赖 F-SO-009 输出
description: "3 个 Skill 存在功能重叠和调用依赖"
expected:
  multi_skill_analysis:
    dependency_matrix:
      - {from: "F-SO-010", to: "F-SO-009", type: "data_dep"}  # 读取 F-SO-009 输出
      - {from: "F-SO-010", to: "F-SO-008", type: "data_dep"}  # 读取检查报告
    overlaps:
      - {skill_a: "F-SO-008", skill_b: "F-SO-009", overlap: "许可证检查", severity: MEDIUM}
    conflicts: []  # 无明显冲突
    recommended_order: ["F-SO-008", "F-SO-009", "F-SO-010"]
  selected_patterns_include: [10, 11]  # 跨 Skill 重组 + 批量优化
```

