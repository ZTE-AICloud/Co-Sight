skill_description: |
  # code-formatter

  ## Description
  Format source code files according to defined style rules for Python (PEP 8 via black),
  JavaScript (Prettier), and YAML. Run formatting and report which files were modified.
  This skill ONLY handles formatting; it does not perform linting, security checks,
  or code quality analysis.

  ## Operations (Q1-Q4 analysis)
  - Operation type: Tool Orchestration (external formatter execution)
  - Input: File paths (list of files to format)
  - Output: List of modified files + diff summary
  - Constraints: Never modify files outside the specified paths; never run sudo

  ## Granularity Decision
  - G1: Single-skill operations — this is one focused operation (format)
  - No G2 upgrade needed

  ## Constraints (auto-derived)
  - Tool must exist on PATH before execution (black, prettier, yamllint)
  - Only process files with recognized extensions (.py, .js, .ts, .jsx, .tsx, .yaml, .yml)
  - Max file size: 10MB (avoid formatting huge generated files)
  - Never format files in node_modules/, .git/, __pycache__/, venv/

