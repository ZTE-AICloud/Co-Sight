# 所有 Pipeline Step 产出物的公共 frontmatter 字段
# 消费者: 各 gate/SubAgent 按需校验产出物 frontmatter（无自动引用引擎）

type: map
required: true
mapping:
  outcome_status:
    type: str
    required: true
    enum: [verified, blocked, declined, unrunnable]
    description: "当前 step 的完成状态。verified=通过，blocked=阻断，declined=降级，unrunnable=环境不可达"

  completion_percentage:
    type: int
    required: true
    range: {min: 0, max: 100}
    description: "真实完成比例，禁止始终写 100"

  memory_refs:
    type: seq
    required: true
    sequence:
      - type: str
    description: "至少 1 个 [[memory-entry]] 双链引用"

  phase:
    type: str
    required: true
    description: "当前 step 标识，如 step-1-requirement-clarification"

  blocked_reason:
    type: str
    required: false
    description: "当 outcome_status=blocked 时必填"
