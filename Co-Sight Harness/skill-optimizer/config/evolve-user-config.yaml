# user-config.yaml — 业务方唯一配置入口
# ─────────────────────────────────────────────────────────────────────
# 业务方只编辑这一个文件，声明自己的：
# 1. API 认证和模型配置
# 2. 路径配置
# 3. 评测过滤
# 4. 产物结构（给 LLM 子 Agent 看的自然语言描述）
#
# ⚠️ 本文件包含敏感信息（API key），不要提交到 git！
# 已在 .gitignore 中排除。
# ─────────────────────────────────────────────────────────────────────

# =============================================================================
# 0. 评测模型（单点配置:模型变化只改这里,不波及代码）
# =============================================================================
# eval_model: 评测流水线(phase1-build / phase2-exec / phase3-eval / phase4-diagnosis)使用的模型。
#   ⚠️ 评测是高频消耗场景,建议用本地学生模型(如 minimax2.7,本地 router 无 Token 配额限制);
#   不要把教师模型(M3)配给评测 —— 评测 judge 会耗尽教师模型配额(429) → 评测失败/0分/极慢。
#   优化环节(ProposalAgent / score-analyzer)用项目模型(cosight settings.json 的 M3),不受此配置影响。
# 未配置 → 评测继承全局环境(可能继承 M3,有配额风险),建议显式配置。
eval_model:
  name: "minimax2.7"
  base_url: "http://127.0.0.1:3456/v1/messages?beta=true"
  # ccr 网关(127.0.0.1:3456)要求客户端携带它自己的 APIKEY;若缺失,评测 cosight 会继承
  # 全局 ANTHROPIC_AUTH_TOKEN(教师模型 key),被 ccr 以 "Invalid API key"(401) 拒绝 → 评测全 0 分。
  api_key: "REPLACE_WITH_YOUR_KEY"

# 1. 演化策略（行为开关，优先级链:CLI > env SKILLX_* > 此 yaml > 默认值）
# =============================================================================
# 业务方按场景选择优化模式;改 yaml 即可换模式,framework 0 代码改动。
# 字段全部可选,留空走 framework 默认值。
evolution_strategy:
  # 候选起点是否锚定原始 baseline
  # True  → 每轮都从 baseline 拷贝出发,禁止继承上轮 best skill(强反过拟合)
  # False → round > 1 时继承 eng.best_round 的 skill(默认链式 hill-climb)
  # 默认 false(留空 = 当前行为,向后兼容)
  # 2026-08-02 实测:True 导致每轮 from-scratch,前轮有效 mod 下轮不保留 → 分数随机游走;改 False 让改进累积
  baseline_anchored: False

# =============================================================================
# 0. 核心抽取策略（写在最前面，每个 LLM 子 Agent 第一眼必看）

# =============================================================================
# ⚠️ 0. 核心抽取策略（写在最前面，每个 LLM 子 Agent 第一眼必看）
# =============================================================================
# 业务方评测产物**异构严重**，每个 case 子目录 results/ 下的文件**因管道版本/分支而异**。
# 抽取原则：**先看有什么文件，再选 schema，不要预设单一 schema**。
#
# 【核心策略】分数来源：JSON 优先 → JSON 缺失回退 MD
#   - **优先探查 JSON**:`eval_report.json` / `summary.json` / `eval_result.json` / 旧命名 json 任意一个
#   - **JSON 完全缺失时回退 MD**:`eval_report.md` 表格里有「最终得分」/「F1得分」列
#   - **不要**只看 MD(会漏掉 JSON 已有的精确分),**也不要**只看 JSON(会漏掉 S5 这类无 JSON 的 case)
#
# 【异构证据】实测 9 个 case 的产物文件集分布:
#   - 3 个 case:`{req_id}-{活动}-{子活动}-{ts}.json` 旧扁平 JSON(S1)
#   - 2 个 case:`eval_report.json` 新扁平 JSON(S2)
#   - 1 个 case:`summary.json` table_flow JSON(S3,**单位混用**:f1 是 0~1,recall_score 是百分制)
#   - 1 个 case:`eval_result.json` 极简 JSON(S4,**无 f1 字段,需算**)
#   - 2 个 case:只有 `eval_report.md`,**无任何 JSON**(S5,必须从 md 表格抽)
# =============================================================================

