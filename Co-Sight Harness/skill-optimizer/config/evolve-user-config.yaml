# 2. 路径配置（统一根目录 + 拼接，避免重复写绝对路径）
# =============================================================================
# 路径变量由用户在 shell 里 export 注入,例如:
#   export SKILLX_ROOT=/path/to/skillx-alpha-agents
# 注意:路径变量不要放在 .claude/settings.local.json(那里只放模型配置)
# ⚠️ 此处**不要**用 ${SKILLX_ROOT} 占位符写法(PyYAML 不会展开 env-var,会留下字面量被误当路径段)。
#   留空表示交给代码按 SKILLX_ROOT env / 工程根 fallback 派生。
paths:
  # 统一根目录（由代码自动派生 SKILLX_WORKSPACE / SKILLX_SANDBOX_ROOT）
  # 优先级链: shell env.SKILLX_ROOT > 框架默认(/media/vdb/skillx-alpha)
  # ⚠️ 留空,不要填 ${SKILLX_ROOT}(PyYAML 不展开,会产生字面量目录)
  # 2026-08-03:显式固定到 /media/vdb/skillx-alpha,确保 evolution_workspace 落到全局位置(/media/vdb/skillx-alpha/evolution_workspace)
  root: /media/vdb/skillx-alpha

  # 评测产物清理目录（每轮测试前/后会被清空）
  # 多个目录用 YAML list 写法，按顺序全部清理
  # SDD_EVAL_DIR 已直接指向 data 目录,无需再追加 /data
  need_cleaned_dir:
    - /media/vdb/skillx-alpha/cosight-agent-core-sdd/workspace/SDD评测Agent/data
    - /media/vdb/skillx-alpha/cosight-agent-core-sdd/workspace/系统方案设计Agent/changes
    - /media/vdb/skillx-alpha/cosight-agent-core-sdd/workspace/需求分析Agent/changes
    - /media/vdb/skillx-alpha/cosight-agent-sdd/workspace/SDD评测Agent/data
    - /media/vdb/skillx-alpha/cosight-agent-sdd/workspace/系统方案设计Agent/changes
    - /media/vdb/skillx-alpha/cosight-agent-sdd/workspace/需求分析Agent/changes
    - /media/vdb/skillx-alpha/cosight-agent-sdd/consume_lib/design/方法库/common/evaluate/SDD评测/suites/projects/5GNR/data
    - /tmp/mock_pipeline/data

# =============================================================================
# 2.5 证据文件路径(evidence_paths)— 业务方声明 phase3-eval 下的子目录与文件名规则
# =============================================================================
# 通用化:skillx 框架不感知具体业务(gold/llm_output 文件名因业务而异),
# 业务方在此声明自己的命名规则,ExtractionAgent 据此精确 Read 真文件,
# 避免"凭章节名合理编造"的 bug(2026-07-30 教训)。
#
# 字段全部可选,留空走 framework 默认值;改 YAML 即可换业务,framework 0 改动。
evidence_paths:
  # phase3-eval 每个 case 子目录下的 3 个标准子目录(默认 inputs/gold, inputs/agent, results)
  gold_subdir: "inputs/gold"
  agent_subdir: "inputs/agent"
  results_subdir: "results"

  # gold 文件名匹配模式(glob 风格,默认 R_*.md 适配 SDD 命名 R_xxx.md)
  # 例:SDD 业务 = "R_*.md",其他业务可改 "gold_*.md" / "expected_*.txt" 等
  # ⚠️ 用 glob 通配,LLM 必须 Read 拿真实文件名,禁止用通配符路径跳过 Read
  gold_filename_glob: ["R_*.md", "全量_*.md"]

  # llm_output 文件名匹配模式(默认 C_*.md 适配 SDD 命名 C_xxx.md)
  # 例:SDD 业务 = "C_*.md",其他业务可改 "agent_*.md" / "actual_*.txt" 等
  llm_output_filename_glob: ["C_*.md", "全量_*.md"]

  # diff_notes 提取字段路径(默认 evaluation_items[0].diff_notes 适配 S7 schema)
  # 业务方按自己 schema 改,如 S1 改 "total_score.diff_notes"、S2 改 "diff_notes" 等
  diff_notes_json_field: "evaluation_items[0].diff_notes"

  # diff_notes 所在的 results/ 下文件名(默认 glob 匹配适配 S7)
  # S7 标准是 {评估项名}_eval_data.json(如 用户需求分析_eval_data.json), 也兼容纯 eval_data.json
  # 业务方可改 eval_report.json / summary.json / eval_result.json 或具体文件名
  diff_notes_filename: "*_eval_data.json"

  # 是否在 score.json 落盘时做字节校验(framework 端兜底)
  # True 时 framework 会 Read 真文件 len() 与 LLM 报 file_bytes 对比,不一致标 mismatch
  enable_byte_verification: true

  # 字节偏差报警阈值(超过此比例视为 mismatch,默认 0.5 = 50%)
  byte_mismatch_threshold: 0.5

  # 评分规则(注入到 result_diff 报告开头,告诉 LLM 分数怎么算)
  # 业务方在改 SKILL.md 时,要先看评分规则 → 知道改什么能提分
  # 格式:每子活动(chapter)→ 维度(dimensions)→ 5 维评分法 + 阈值
  # 注入位置:context_extractor 渲染 prompt 时,拼到"必读历史数据"段开头
  # 留空=不注入
  scoring_rule: |
    需求分析活动 / 用户需求分析子活动 (weight=0.1, 满分 100):
    - eval_type: table_flow
    - table_format: | 用户 | 场景 | 解决的问题&期望达成的目标 |
    - 2 个维度(各 100 分制):
      · 召回率 = C∩R / R(C 输出场景与 R 语义匹配成功的个数 / R 所有场景个数)
      · 精确率 = C∩R / C(C 输出场景与 R 语义匹配成功的个数 / C 所有场景个数)
    - 语义匹配判定 — 5 维评分法(每对 C-R 场景条目):
      · ① 主题一致性(20): 核心概念是否同功能/特征(同义缩写/修饰省略=高分;XR↔5QI=低分)
      · ② 粒度对等性(20): 抽象级别一致(同层级详略=高分;语音业务↔语音寻呼=低分)
      · ③ 主体/视角匹配(20): 主体或视角一致(UE↔终端=同主体;运维↔终端=低分)
      · ④ 行为/状态一致性(20): 行为或状态对应(接收↔接收=高分;接收↔发送=低分)
      · ⑤ 限定条件匹配(20): 限定/部署/用户群对等(同频小区↔小区重叠=中;Type6↔大包=低)
    - 阈值:5 维得分相加 ≥60 → 匹配;<60 → 不匹配
    - 争议处理:总分 55-59 倾向判不匹配
    - 输出:「结论:匹配/不匹配 | 总分:XX | 分项:主题XX+粒度XX+主体XX+行为XX+限定XX | C:xxx | R:xxx」
    - 同一对 C-R 条目:召回率和精确率结论必须一致(不得矛盾)
    - 改 SKILL.md 时,优先修这 5 维里的 1-2 个高频失分维度 → 直接提分

