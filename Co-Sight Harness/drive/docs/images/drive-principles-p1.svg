<tspan x="54.0" dy="0.0" font-size="16.2" font-weight="bold" fill="#175CD3">预置能力 —— 开箱即用的可靠执行底座</tspan>
</text>
<text x="54.0" y="581.3" text-anchor="start" font-family="Microsoft YaHei, WenQuanYi Micro Hei">
<tspan x="54.0" dy="0.0" font-size="12.8" font-weight="normal" fill="#344054">· 7 个岗位 agent：调研 / 规划 / 工头 / 质检 + 2 个只读审查者 + HITL 中介</tspan>
<tspan x="54.0" dy="14.7" font-size="12.8" font-weight="normal" fill="#344054">· phase 默认五阶段流水线，每阶段结束 HITL 闸门，人审不过不往下走</tspan>
<tspan x="54.0" dy="14.7" font-size="12.8" font-weight="normal" fill="#344054">· 8 个 Hook 防护脚本：写盘白名单 default-deny · 合法迁移 · 审计</tspan>
<tspan x="54.0" dy="14.7" font-size="12.8" font-weight="normal" fill="#344054">· 3 层质检：L0 文件存在 / L1 lint·类型 / L2 LLM Judge + 5 维 rubric</tspan>
</text>
<rect x="672.0" y="524.0" width="632.0" height="195.0" rx="0.1" fill="#F9FAFB" stroke="#D0D5DD" stroke-width="1.2"/>
<text x="696.0" y="547.8" text-anchor="start" font-family="Microsoft YaHei, WenQuanYi Micro Hei">
<tspan x="696.0" dy="0.0" font-size="16.2" font-weight="bold" fill="#101828">可编排能力 —— workflow.yaml 声明即流程</tspan>
</text>
<text x="696.0" y="581.3" text-anchor="start" font-family="Microsoft YaHei, WenQuanYi Micro Hei">
<tspan x="696.0" dy="0.0" font-size="12.8" font-weight="normal" fill="#344054">· 增删环节 / 换 agent / 调 gate，校验过即用，不改插件代码</tspan>
<tspan x="696.0" dy="14.7" font-size="12.8" font-weight="normal" fill="#344054">· DAG 模式：depends_on 自定义拓扑 + 节点级 HITL gate + 复杂度策略</tspan>
<tspan x="696.0" dy="14.7" font-size="12.8" font-weight="normal" fill="#344054">· 4 种 agent 地址混用：drive: 内置 / 项目本地 / @CC 子 agent / plugin:</tspan>
<tspan x="696.0" dy="14.7" font-size="12.8" font-weight="normal" fill="#344054">· 5G NR：三层控制配置由 Harness 从口语化需求自动生成，无需人工编写</tspan>
</text>
